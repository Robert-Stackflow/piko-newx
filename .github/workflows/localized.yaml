name: Build Simplified Chinese NewX

on:
  workflow_dispatch:
  push:
    branches: [main, codex/zh-cn, codex/list-scroll-fix]
    paths:
      - localization/**
      - tests/**
      - fixes/**
      - build_localized.py
      - .github/workflows/localized.yaml

permissions:
  contents: read
  packages: read

concurrency:
  group: localized-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build localized patches from pinned source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build_localized.py
      - uses: actions/upload-artifact@v4
        with:
          name: piko-newx-zh-CN
          path: bins/
          if-no-files-found: error
          retention-days: 30
